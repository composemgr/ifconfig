name: ifconfig
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: casjaysdevdocker/ifconfig:latest
    container_name: ifconfig-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    tty: true
    stdin_open: true
    privileged: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_PROTOCOL: http
      CONTAINER_NAME: ifconfig-app
      CONTAINER_WEB_SERVER_PROTOCOL: http
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DOMAINNAME: ${BASE_DOMAIN_NAME:-$HOSTNAME}
      CURRENT_IP_4: ${CURRENT_IP_4:-}
      CURRENT_IP_6: ${CURRENT_IP_6:-}
    volumes:
      - './volumes/data/ifconfig:/data:z'
      - './volumes/config/ifconfig:/config:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://ifconfig-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - ifconfig
      - cloudflare

networks:
  ifconfig:
    name: ifconfig
    external: false
  cloudflare:
    external: true
